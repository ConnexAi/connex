version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: connex-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: connex
      POSTGRES_PASSWORD: connex
      POSTGRES_DB: connex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
